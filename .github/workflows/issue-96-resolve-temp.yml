name: Temporary issue 96 npm compatible transitive resolver
on:
  push:
    branches: [security/issue-96-client-transitives-20261122]
    paths: ['.github/workflows/issue-96-resolve-temp.yml', 'analyst-app/client/package.json']
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          registry-url: https://registry.npmjs.org
      - name: Generate compatible v3 lock and run production browser bundle
        working-directory: analyst-app/client
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm install --legacy-peer-deps --package-lock-only --lockfile-version=3 --ignore-scripts --no-audit --no-fund
          set +e
          npm audit fix --legacy-peer-deps --package-lock-only --lockfile-version=3 --ignore-scripts --no-fund > audit-fix.log 2>&1
          echo $? > audit-fix.exit
          set -e
          npm ci --no-audit --no-fund
          npm run build:prod
          set +e
          npm audit --omit=dev --json > client-runtime.json
          echo $? > client-runtime.exit
          npm audit --json > client-all.json
          echo $? > client-all.exit
          set -e
          sha256sum package.json package-lock.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-96-client-compatible-candidate
          if-no-files-found: warn
          path: |
            analyst-app/client/package.json
            analyst-app/client/package-lock.json
            analyst-app/client/audit-fix.log
            analyst-app/client/audit-fix.exit
            analyst-app/client/client-runtime.json
            analyst-app/client/client-all.json
            analyst-app/client/client-runtime.exit
            analyst-app/client/client-all.exit
            analyst-app/client/SHA256SUMS
