name: Prepare bounded server lockfile candidate

on:
  pull_request:
    paths: ['.github/workflows/runtime-lock-candidate.yml', 'analyst-app/server/package.json', 'analyst-app/server/package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve just two critical transitive candidates
        shell: bash
        run: |
          set -eu
          cd analyst-app/server
          npm pkg set 'overrides.thenify=3.3.1' 'overrides.proxy-addr=2.0.8'
          npm install --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const p=require('./package-lock.json');
          for(const [name,version] of [['thenify','3.3.1'],['proxy-addr','2.0.8']]) {
            if(p.dependencies[name]?.version!==version) throw new Error(name+' not locked at '+version);
          }
          console.log('PASS exact transitive versions; lockfileVersion='+p.lockfileVersion);
          JS
          mkdir -p ../../candidate
          cp package.json package-lock.json ../../candidate/
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls thenify proxy-addr --all > ../../candidate/npm-ls.txt 2>&1 || true
          cp ../../candidate/npm-ls.txt ../../candidate/dependency-tree.txt
          git diff --stat > ../../candidate/diff-stat.txt
      - name: Upload npm-generated manifest and lock for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-critical-transitives-generated
          path: candidate/
          retention-days: 14
          if-no-files-found: warn
