name: Temporary Ant Design 4 runtime migration resolver
on:
  push:
    branches: [security/issue-96-antd4-runtime-20261122]
    paths: ['.github/workflows/issue-96-antd4-resolve-temp.yml', 'analyst-app/client/package.json', 'analyst-app/client/src/**']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          registry-url: https://registry.npmjs.org
      - name: Resolve v3 lock and test production build
        working-directory: analyst-app/client
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm install --legacy-peer-deps --package-lock-only --lockfile-version=3 --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          set +e
          npm run build:prod > build.log 2>&1
          build_status=$?
          echo "$build_status" > build.exit
          cat build.log | tail -n 160
          npm audit --omit=dev --json > client-runtime.json
          echo $? > client-runtime.exit
          npm audit --json > client-all.json
          echo $? > client-all.exit
          set -e
          sha256sum package.json package-lock.json > SHA256SUMS
          tar -czf client-source.tar.gz src config
          test "$build_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-96-antd4-candidate
          if-no-files-found: warn
          path: |
            analyst-app/client/package.json
            analyst-app/client/package-lock.json
            analyst-app/client/client-runtime.json
            analyst-app/client/client-all.json
            analyst-app/client/client-runtime.exit
            analyst-app/client/client-all.exit
            analyst-app/client/build.log
            analyst-app/client/build.exit
            analyst-app/client/SHA256SUMS
            analyst-app/client/client-source.tar.gz
