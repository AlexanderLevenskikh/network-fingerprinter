name: Temporary issue 95 HTTP runtime cohort resolver
on:
  push:
    branches:
      - security/issue-95-server-runtime-cohort-20261122
    paths:
      - 'analyst-app/server/package.json'
      - '.github/workflows/issue-95-http-resolve-temp.yml'
  pull_request:
    paths:
      - 'analyst-app/server/package.json'
      - '.github/workflows/issue-95-http-resolve-temp.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          registry-url: https://registry.npmjs.org
      - name: Resolve exact HTTP package cohort
        working-directory: analyst-app/server
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm install --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm audit --omit=dev --json > server-prod.json || status=$?
          test "${status:-0}" -le 1
          npm audit --json > server-all.json || status2=$?
          test "${status2:-0}" -le 1
          sha256sum package.json package-lock.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: issue-95-http-lock-audit
          if-no-files-found: error
          path: |
            analyst-app/server/package.json
            analyst-app/server/package-lock.json
            analyst-app/server/server-prod.json
            analyst-app/server/server-all.json
            analyst-app/server/SHA256SUMS
